# sslip.io 的 Let's Encrypt HTTP-01 验证 + HTTP 跳转 HTTPS
# 裸 IP 的 80 端口由现有站点占用，其 ACME location 位于：
# /www/server/panel/vhost/nginx/well-known/47.120.19.14.conf
# 放置位置：/www/server/panel/vhost/nginx/noticeaction-acme.conf
server {
    listen 80;
    server_name 47-120-19-14.sslip.io;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
    }

    location / {
        return 301 https://$host:8084$request_uri;
    }

    access_log /www/wwwlogs/noticeaction-acme.log;
    error_log  /www/wwwlogs/noticeaction-acme.error.log;
}
