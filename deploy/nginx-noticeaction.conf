# NoticeAction 反向代理（HTTPS）
# 放置位置：/www/server/panel/vhost/nginx/noticeaction.conf
map $uri $noticeaction_parse_limit_key {
    default "";
    /api/parse $binary_remote_addr;
}

limit_req_zone $noticeaction_parse_limit_key zone=noticeaction_parse:10m rate=20r/m;

server {
    listen 8084 ssl;
    server_name 47.120.19.14 47-120-19-14.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/noticeaction-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noticeaction-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NoticeAction:10m;
    ssl_session_timeout 10m;

    # 用 http:// 误访问 HTTPS 端口时自动跳转（497 = plain HTTP request sent to HTTPS port）
    error_page 497 =301 https://$host:$server_port$request_uri;

    client_max_body_size 25m;
    limit_req zone=noticeaction_parse burst=20 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:43173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    access_log /www/wwwlogs/noticeaction.log;
    error_log  /www/wwwlogs/noticeaction.error.log;
}
